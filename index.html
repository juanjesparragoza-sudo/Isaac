<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚡ ¡Isaac cumple 9! - Fiesta Pokémon</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --pk-red: #EE1515;
      --pk-blue: #222224;
      --pk-yellow: #F0C040;
      --pk-white: #F0F0F0;
      --pk-black: #222224;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--pk-blue);
      color: var(--pk-white);
      margin: 0;
      overflow-x: hidden;
    }

    /* ===== GIF BACKGROUND ===== */
    #gif-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -2;
      background-image: url('https://media.giphy.com/media/10LKovKon8DENq/giphy.gif');
      background-size: cover;
      background-position: center;
      filter: brightness(0.5);
    }

    /* ===== GIF FLOTANTE DELANTE ===== */
    .gif-flotante {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 100px;
      z-index: 10000;
      pointer-events: none;
      animation: flotar 3s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* ===== HERO SECTION ===== */
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: rgba(0,0,0,0.4);
    }

    .hero-title {
      color: var(--pk-yellow);
      text-shadow: 4px 4px 0 #3b4cca;
      font-size: clamp(16px, 5vw, 32px);
    }

    .number-9 {
      font-size: 120px;
      color: var(--pk-yellow);
      text-shadow: 8px 8px 0 #3b4cca;
      margin: 20px 0;
    }

    /* ===== MAPA ===== */
    .map-section {
      padding: 40px 20px;
      text-align: center;
    }

    .map-container {
      max-width: 600px;
      margin: 0 auto;
      border: 6px solid var(--pk-red);
      border-radius: 12px;
      overflow: hidden;
    }

    .map-container iframe {
      width: 100%;
      height: 350px;
      border: none;
    }

    /* ===== FORMULARIO RSVP ===== */
    .rsvp-section {
      padding: 60px 20px;
      background: rgba(34, 34, 36, 0.9);
      text-align: center;
    }

    .rsvp-form {
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .pk-input, .pk-select {
      width: 100%;
      padding: 15px;
      font-family: 'Press Start 2P';
      font-size: 10px;
      border: 4px solid var(--pk-black);
    }

    .pk-btn {
      background: var(--pk-yellow);
      padding: 20px;
      font-family: 'Press Start 2P';
      cursor: pointer;
      border: 4px solid var(--pk-black);
    }

    /* ===== BOTÓN MÚSICA GIGANTE ===== */
    #music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      width: 80px;
      height: 80px;
      background: var(--pk-white);
      border: 5px solid var(--pk-black);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 var(--pk-black);
    }

    #music-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 50%;
      background: var(--pk-red);
      border-radius: 40px 40px 0 0;
    }

    #music-btn::after {
      content: '';
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 5px;
      background: var(--pk-black);
      transform: translateY(-50%);
    }

    #music-btn span {
      position: relative;
      z-index: 2;
      background: var(--pk-white);
      border: 5px solid var(--pk-black);
      border-radius: 50%;
      width: 20px;
      height: 20px;
    }

    #music-label {
      position: fixed;
      bottom: 115px;
      right: 18px;
      z-index: 999;
      font-size: 10px;
      color: var(--pk-yellow);
      background: rgba(0,0,0,0.8);
      padding: 8px 12px;
      border: 3px solid var(--pk-yellow);
      text-shadow: 2px 2px 0 #000;
    }

    .msg-box { display: none; padding: 15px; margin-top: 10px; font-size: 10px; }
    .msg-box.show { display: block; }
    .msg-box.success { background: #d4edda; color: #155724; }
  </style>
</head>
<body>

<div id="gif-bg"></div>

<img src="tu-personaje.gif" class="gif-flotante">

<audio id="bg-music" loop>
  <source src="nombre-de-tu-archivo.mp3" type="audio/mpeg">
</audio>

<div id="music-label">MÚSICA</div>
<button id="music-btn"><span></span></button>

<main>
  <section class="hero">
    <h1 class="hero-title">¡ISAAC CUMPLE 9!</h1>
    <div class="number-9">9</div>
    <p>Sábado 30 de Mayo - 16:00hs</p>
  </section>

  <section class="map-section">
    <h2 style="font-size: 12px; color: var(--pk-yellow);">📍 UBICACIÓN</h2>
    <p style="font-size: 8px; margin-bottom: 15px;">Luis María Campos 4354, Caseros</p>
    <div class="map-container">
      <iframe src="http://googleusercontent.com/maps.google.com/4"></iframe>
    </div>
  </section>

  <section class="rsvp-section">
    <h2 style="font-size: 12px; margin-bottom: 20px;">✅ CONFIRMAR ASISTENCIA</h2>
    <form class="rsvp-form" id="rsvpForm">
      <input class="pk-input" type="text" id="nombre" name="nombre" placeholder="TU NOMBRE" required>
      <select class="pk-select" id="personas" name="personas" required>
        <option value="1">1 ENTRENADOR</option>
        <option value="2">2 ENTRENADORES</option>
        <option value="3">3 ENTRENADORES</option>
        <option value="4">4 ENTRENADORES</option>
      </select>
      <div id="msgBox" class="msg-box"></div>
      <button class="pk-btn" type="submit" id="submitBtn">⚡ ¡CONFIRMAR! ⚡</button>
    </form>
  </section>
</main>

<script>
  // MÚSICA
  const audio = document.getElementById('bg-music');
  const btn = document.getElementById('music-btn');
  const label = document.getElementById('music-label');
  let playing = false;

  btn.addEventListener('click', () => {
    if (!playing) {
      audio.play();
      label.textContent = 'SILENCIAR';
      playing = true;
    } else {
      audio.pause();
      label.textContent = 'MÚSICA';
      playing = false;
    }
  });

  // FORMULARIO SHEETDB
  document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btnSubmit = document.getElementById('submitBtn');
    const box = document.getElementById('msgBox');
    
    const nombre = document.getElementById('nombre').value;
    const personas = document.getElementById('personas').value;
    const fecha = new Date().toLocaleString('es-AR');

    btnSubmit.disabled = true;
    btnSubmit.textContent = '...';

    try {
      // USANDO TU NUEVO LINK DE SHEETDB
      const res = await fetch('https://sheetdb.io/api/v1/wjdodiixmqxis', {
        method: 'POST',
        headers: { 
          'Accept': 'application/json',
          'Content-Type': 'application/json' 
        },
        body: JSON.stringify({
          data: [{ nombre, personas, fecha }]
        })
      });

      if (res.ok) {
        box.textContent = '¡ATRAPADO! ASISTENCIA CONFIRMADA.';
        box.className = 'msg-box show success';
        this.reset();
      }
    } catch (err) {
      box.textContent = 'ERROR AL ENVIAR.';
      box.className = 'msg-box show';
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = '⚡ ¡CONFIRMAR! ⚡';
    }
  });
</script>

</body>
</html>
